name: release

# Push a tag like v0.2.0 to build nosleep.exe and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "nosleep-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/nosleep.exe dist/nosleep.exe
          Compress-Archive -Path dist/nosleep.exe, README.md, LICENSE -DestinationPath "dist/$name.zip"
          $sums = Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $sums | Out-File dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: nosleep-windows-x64
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          # Re-running for an existing tag (e.g. a re-pushed tag) refreshes the files instead of failing.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi
