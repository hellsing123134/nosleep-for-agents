[package]
name = "nosleep"
version = "0.1.1"
edition = "2021"
description = "Keeps Windows awake while your AI coding agents work, even with the lid closed"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hellsing123134/nosleep-for-agents"
keywords = ["ai-agents", "claude-code", "codex", "caffeinate", "windows"]

[dependencies]
serde_json = "1"
ureq = "2"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
